name: Mogul
description: >-
  Mogul is a modern executive advisory, training, and executive search firm
  serving 600+ leading companies, with particular focus on leadership
  development and AI transformation across retail, consumer goods, healthcare,
  media, and nonprofit sectors. Its services span executive advisory (fractional
  AI and HR leadership, AI adoption and change management, AI agent buildout),
  executive training (signature programs from "AI Readiness for Enterprise"
  through "Organizational Leadership," delivered on-demand or live), and
  executive search (C-suite, board, and professional placements with succession
  planning). Mogul reports having educated 1MM+ leaders and counts Amazon,
  Google, Disney, Microsoft, and Nike among its clients. It was surfaced as a
  500 Global portfolio company. Mogul publishes no public developer program,
  API, or documentation; it operates as a B2B services and training business.
